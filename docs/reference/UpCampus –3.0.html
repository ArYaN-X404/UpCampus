<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UpCampus – Student Governance OS</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5ff;--m1:#e8e2ff;--m2:#dcf5ea;--m3:#ffeee0;--text:#2b2d42;--mut:#6d7193;--card:rgba(255,255,255,.82);--line:rgba(110,100,170,.16);--sh:0 12px 34px rgba(110,100,170,.13);--pill:rgba(110,100,170,.08);--on:#fff;--cs:#fdfcff;--tr:rgba(196,181,253,.42);--tg:rgba(150,225,185,.38);
--gb:#c7f0d8;--gf:#1d6a45;--sb:#cfe6ff;--sf:#1c5a95;--rb:#ffd5dc;--rf:#a13a50;--lb:#e4dbff;--lf:#5a44a6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14152b;--m1:#2a2560;--m2:#173b3a;--m3:#3a2335;--text:#eceefc;--mut:#a3a8cc;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--sh:0 14px 36px rgba(0,0,0,.35);--pill:rgba(255,255,255,.07);--on:rgba(255,255,255,.15);--cs:#1d1e3a;--tr:rgba(190,170,255,.18);--tg:rgba(140,230,180,.15);--gb:rgba(140,230,180,.17);--gf:#a8efc8;--sb:rgba(140,200,255,.17);--sf:#aad6ff;--rb:rgba(255,140,165,.17);--rf:#ffb4c3;--lb:rgba(190,170,255,.17);--lf:#cfc2ff}}
:root[data-theme="dark"]{--bg:#14152b;--m1:#2a2560;--m2:#173b3a;--m3:#3a2335;--text:#eceefc;--mut:#a3a8cc;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--sh:0 14px 36px rgba(0,0,0,.35);--pill:rgba(255,255,255,.07);--on:rgba(255,255,255,.15);--cs:#1d1e3a;--tr:rgba(190,170,255,.18);--tg:rgba(140,230,180,.15);--gb:rgba(140,230,180,.17);--gf:#a8efc8;--sb:rgba(140,200,255,.17);--sf:#aad6ff;--rb:rgba(255,140,165,.17);--rf:#ffb4c3;--lb:rgba(190,170,255,.17);--lf:#cfc2ff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(700px 420px at 6% -4%,var(--m1),transparent 70%),radial-gradient(640px 400px at 100% 0,var(--m2),transparent 70%),radial-gradient(760px 500px at 50% 112%,var(--m3),transparent 70%);background-attachment:fixed;color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:22px 16px 70px}
.serif{font-family:Fraunces,Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--lf);background:linear-gradient(135deg,var(--lb),var(--sb));border:1px solid var(--line);box-shadow:var(--sh)}
.brand h1{margin:0;font-size:26px;line-height:1}
.brand h1 span{color:var(--sf)}
.brand small{display:block;margin-top:4px;font-size:10px;letter-spacing:.16em;color:var(--mut)}
.actions{display:flex;gap:10px;align-items:center}
.ic{width:40px;height:40px;border-radius:50%;background:var(--pill);border:1px solid var(--line)}
.cta{padding:10px 18px;border-radius:999px;background:var(--gb);color:var(--gf);font-weight:600;border:1px solid rgba(255,255,255,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 22px rgba(120,200,160,.3),inset 0 1px 0 rgba(255,255,255,.6);transition:.2s}
.cta:hover{transform:translateY(-1px)}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--pill);border:1px solid var(--line);max-width:100%;overflow-x:auto}
.seg button{padding:7px 14px;border-radius:999px;color:var(--mut);font-weight:500;white-space:nowrap;transition:.2s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--on);color:var(--text);box-shadow:0 2px 8px rgba(110,100,170,.15)}
.nav{display:flex;justify-content:center;margin:22px 0 4px}
.hero{text-align:center;margin:22px 0}
.hero h2{margin:0;font-size:clamp(30px,5.5vw,44px);line-height:1.1}
.hero p{margin:8px auto 0;color:var(--mut);max-width:480px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.search{display:flex;gap:10px;align-items:center;flex:1 1 240px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);height:46px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit}
.search input::placeholder{color:var(--mut)}
.cnt{margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--pill);font-size:12px}
.card{position:relative;overflow:hidden;margin-top:18px;padding:20px 22px 14px;border-radius:26px;border:1px solid var(--line);box-shadow:var(--sh);background:radial-gradient(380px 150px at 0 0,var(--ta),transparent 70%),radial-gradient(380px 150px at 100% 0,var(--ta),transparent 70%),var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:.25s}
.card:hover{transform:translateY(-2px)}
.card.broken{--ta:var(--tr);--te:#c4b5fd}
.card.need{--ta:var(--tg);--te:#8fdcb2}
.card::before,.card::after{content:"";position:absolute;top:26px;bottom:26px;width:3px;background:linear-gradient(var(--te),transparent)}
.card::before{left:0;border-radius:0 3px 3px 0}
.card::after{right:0;border-radius:3px 0 0 3px}
.hd{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--lf);background:linear-gradient(135deg,var(--lb),var(--sb));border:1px solid var(--line)}
.hd b{display:block;font-size:14.5px;line-height:1.2}
.hd small{color:var(--mut);font-size:12.5px}
.cat{margin-left:auto;font-size:12px;padding:4px 11px;border-radius:999px;background:var(--pill);color:var(--mut)}
.card h3{margin:14px 0 6px;font-size:24px;line-height:1.2;letter-spacing:-.01em}
.card p{margin:0;color:var(--mut)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tg{padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--pill);color:var(--mut)}
.tg.r{background:var(--rb);color:var(--rf)}.tg.g{background:var(--gb);color:var(--gf)}
.md{display:grid;gap:4px;margin-top:14px;border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9}
.md img{width:100%;height:100%;min-height:0;object-fit:cover;display:block;cursor:zoom-in;transition:.3s}
.md img:hover{transform:scale(1.03)}
.md.n2,.md.n4{grid-template-columns:1fr 1fr}
.md.n3{grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr}
.md.n3 img:first-child{grid-row:span 2}
.md.n4{grid-template-rows:1fr 1fr}
.acts{display:flex;align-items:center;gap:4px;margin-top:14px;padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.vt{display:flex;align-items:center}
.vt b{min-width:28px;text-align:center;font-size:14.5px}
.ab{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;color:var(--mut);font-size:13.5px;font-weight:500;transition:.15s}
.ab:hover{color:var(--text)}
.vt .on{color:var(--gf)}.vt .dn.on{color:var(--rf)}
.sp{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pl{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600}
.pl::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pl.approved{background:var(--gb);color:var(--gf)}.pl.pending{background:var(--sb);color:var(--sf)}.pl.declined{background:var(--rb);color:var(--rf)}
.mb{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600}
.mb.a{background:var(--gb);color:var(--gf)}.mb.d{background:var(--rb);color:var(--rf)}.mb.s{background:var(--lb);color:var(--lf)}
.empty{text-align:center;color:var(--mut);padding:50px 0}
dialog{border:1px solid var(--line);border-radius:24px;background:var(--bg);color:var(--text);padding:24px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(40,35,80,.4);backdrop-filter:blur(4px)}
dialog h3{margin:0 0 14px;font-size:24px}
dialog input:not([type=file]),dialog select,dialog textarea{width:100%;margin-bottom:10px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--pill);color:var(--text);font:inherit}
.drop{display:block;text-align:center;padding:16px;margin-bottom:10px;border-radius:16px;border:1.5px dashed var(--gf);background:var(--gb);color:var(--gf);font-weight:500;cursor:pointer}
.drop input{display:none}
.prev{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.prev div{position:relative;width:70px;height:70px}
.prev img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.prev button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#000a;color:#fff;font-size:12px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
#lb{width:min(780px,94vw);padding:10px}
#lb img{display:block;width:100%;border-radius:16px;cursor:zoom-out}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding:9px 18px;border-radius:999px;background:var(--text);color:var(--bg);font-size:13px;transition:.3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.card{padding:16px 16px 10px}.card h3{font-size:20px}.sp{margin-left:0;width:100%;margin-top:6px}}

/* v5 */
.vt{gap:2px;padding:3px 14px 3px 6px;border-radius:999px;background:var(--pill);border:1px solid var(--line);transition:.2s}
.vt b{font-size:18px;font-weight:700;min-width:24px;font-variant-numeric:tabular-nums}
.vt.on{background:var(--gb);border-color:transparent}
.vt.on b{color:var(--gf)}
.md.n1{display:block;aspect-ratio:auto;background:var(--pill)}
.md.n1 img{height:auto;max-height:520px;object-fit:contain}
.md.n2,.md.n3{aspect-ratio:5/2}
.md.n2{grid-template-columns:repeat(2,1fr)}
.md.n3{grid-template-columns:repeat(3,1fr);grid-template-rows:none}
.md.n3 img:first-child{grid-row:auto}
.car{position:relative;margin-top:14px;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sl::-webkit-scrollbar{display:none}
.sl img{flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center;cursor:zoom-in}
.ctr{position:absolute;top:12px;right:12px;padding:3px 10px;border-radius:999px;background:rgba(20,20,40,.55);color:#fff;font-size:12px;font-weight:500}
.nv{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);color:#2b2d42;font-size:20px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nv.l{left:10px}.nv.r{right:10px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);transition:.2s}
.dots i.on{background:#fff;width:8px;height:8px}
@media(hover:none){.nv{display:none}}

/* v6 */
.vt{background:var(--lb);border-color:transparent}
.vt .ab,.vt b{color:var(--lf)}
.vt .on{color:var(--lf)}
.vt.on{background:var(--lb);box-shadow:inset 0 0 0 1.5px var(--lf)}
.vt.on b{color:var(--lf)}

/* v7 */
.card{border-radius:14px;background:radial-gradient(380px 150px at 0 0,var(--ta),transparent 70%),radial-gradient(380px 150px at 100% 0,var(--ta),transparent 70%),var(--cs);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 1px 3px rgba(110,100,170,.1),0 6px 18px rgba(110,100,170,.07)}
.md,.car{border-radius:10px}

/* v8 */
.vt b,.vt.on b{color:var(--sf)}
.cw{position:relative;display:inline-flex}
.pop{position:absolute;left:0;bottom:calc(100% + 8px);width:260px;max-width:70vw;padding:12px 14px;border-radius:12px;background:var(--cs);border:1px solid var(--line);box-shadow:0 10px 28px rgba(110,100,170,.2);opacity:0;transform:translateY(6px);pointer-events:none;transition:.18s;z-index:5;text-align:left}
.cw:hover .pop,.cw:focus-within .pop{opacity:1;transform:none}
.pop small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.pt{font-size:13.5px;line-height:1.45;color:var(--text)}
.pt b{color:var(--lf);font-weight:600}
.pop em{display:block;margin-top:6px;font-style:normal;font-size:12px;color:var(--sf)}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="brand"><div class="logo">↗</div><div><h1 class="serif">Up<span>Campus</span></h1><small>STUDENT GOVERNANCE OS</small></div></div>
 <div class="actions"><button class="ic" id="theme" aria-label="Toggle theme">◐</button><button class="cta" id="post">+ Post Issue</button></div>
</header>
<div class="nav"><div class="seg" id="role"><button class="on">Student</button><button>Supervisor</button><button>Admin</button></div></div>
<div class="hero"><h2 class="serif">What should we fix next?</h2><p>Report what's broken, ask for what's missing, and back the ideas that matter most.</p></div>
<div class="bar"><div class="seg" id="tabs"></div><button class="seg" id="arch" style="padding:0"><span style="padding:7px 14px;color:var(--mut)">✓ Solved Archive <span class="cnt" id="ac">0</span></span></button></div>
<div class="bar">
 <label class="search">🔍<input id="q" placeholder="Search by title, location or keywords…"></label>
 <div class="seg" id="sort"><button class="on" data-s="votes">Top Votes</button><button data-s="new">Newest</button><button data-s="photo">With Photos</button></div>
</div>
<div id="list"></div>
</div>
<dialog id="dlg">
 <h3 class="serif">Post an issue</h3>
 <input id="nt" placeholder="Title">
 <textarea id="nd" rows="3" placeholder="Describe the problem…"></textarea>
 <input id="nl" placeholder="Location (e.g. Hostel B)">
 <select id="nk"><option value="broken">Broken (Fix It)</option><option value="need">Needs (Add It)</option></select>
 <label class="drop">📷 Add photos (up to 4)<input type="file" id="nf" accept="image/*" multiple></label>
 <div class="prev" id="prev"></div>
 <div class="row"><button class="mb" style="background:var(--pill)" id="cx">Cancel</button><button class="cta" id="sv">Post</button></div>
</dialog>
<dialog id="lb"><img id="lbi" alt="Enlarged photo"></dialog>
<div id="toast">Link copied</div>
<script>
function ph(e,a,b){return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/><text x="200" y="185" font-size="110" text-anchor="middle">'+e+'</text></svg>')}
var D=[
{id:1,k:'need',t:'Need a Snack Vending Machine in Library',l:'Central Library Basement',c:'Student Amenities',d:'During exam prep hours, all canteens close by 8 PM. An automated vending machine would help late-night study sessions massively.',v:99,s:'pending',h:5,u:'anon_7f3k',cm:16,tc:{u:'anon_k3d1',t:'Please add a coffee machine too, nights are long during exams.',v:23},imgs:[ph('📚','#f6c9a8','#b9c8f5'),ph('🥤','#b9d8f5','#b8ecd2')]},
{id:2,k:'need',t:'Install 24/7 Power Charging Points on 2nd Floor',l:'Central Library 2nd Floor',c:'Estate & Infrastructure',d:'Laptops die mid-session and sockets are limited. More charging points would keep the reading room usable all day.',v:64,s:'approved',h:9,u:'anon_2m9q',cm:9,tc:{u:'anon_p8q2',t:'Even a few extension boards would help while we wait.',v:11},imgs:[ph('🔌','#c9c2f5','#b9d8f5'),ph('💻','#b8ecd2','#b9d8f5'),ph('📚','#f6c9a8','#d9d2f7'),ph('🪑','#f6c9d3','#c9c2f5')]},
{id:3,k:'broken',t:'No internet in Hostel A common room',l:'Hostel A',c:'Wi-Fi',d:'Wi-Fi has been down since morning and nobody has reported it.',v:41,s:'approved',h:3,u:'anon_c41x',cm:7,tc:{u:'anon_b7m4',t:'The router in the common room has no power light. Told the warden.',v:9},imgs:[ph('📶','#c9c2f5','#b9d8f5'),ph('🖥️','#b8ecd2','#b9d8f5'),ph('🔌','#f6c9d3','#d9d2f7')]},
{id:4,k:'broken',t:'Water cooler leaking near Block C stairs',l:'Block C',c:'Maintenance',d:'The floor stays wet all day and it is a slipping hazard.',v:28,s:'pending',h:12,u:'anon_9d0b',cm:4,tc:{u:'anon_x2c9',t:'Almost slipped here yesterday, needs fixing soon.',v:6},imgs:[ph('💧','#b9d8f5','#c9c2f5')]},
{id:5,k:'broken',t:'Gym treadmill #2 stops mid-run',l:'Campus Gym',c:'Sports',d:'It cuts off after about ten minutes. Needs a technician.',v:17,s:'declined',h:20,u:'anon_5t8e',cm:2,tc:{u:'anon_h5j0',t:'Staff said the belt is already being repaired.',v:3}},
{id:6,k:'broken',t:'Broken tube light in Lab 3',l:'CS Block, Lab 3',c:'Maintenance',d:'Replaced last week by facilities.',v:12,s:'approved',done:1,h:48,u:'anon_8w2n',cm:1,tc:{u:'anon_z1r6',t:'Fixed now, thanks to whoever reported it!',v:2}}];
var S={tab:'broken',sort:'votes',q:'',role:'Student',arch:false,my:{},imgs:[]};
var $=function(i){return document.getElementById(i)};
function esc(x){var e=document.createElement('div');e.textContent=x;return e.innerHTML}
function ic(p){return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg>'}
var UP='M6 15l6-6 6 6',DN='M6 9l6 6 6-6',CM='M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z',SH='M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11zM21.854 2.147 10.914 13.086';
var PL={approved:'Approved by Admin',pending:'Pending',declined:'Declined'};
function media(im){
 var n=im.length,t=im.map(function(u){return '<img src="'+u+'" alt="Photo attached to this issue">'}).join('');
 if(!n)return '';
 if(n<4)return '<div class="md n'+n+'">'+t+'</div>';
 return '<div class="car"><div class="sl">'+t+'</div><span class="ctr">1/'+n+'</span><button class="nv l" data-nav="-1" aria-label="Previous photo">‹</button><button class="nv r" data-nav="1" aria-label="Next photo">›</button><div class="dots">'+im.map(function(_,i){return '<i class="'+(i?'':'on')+'"></i>'}).join('')+'</div></div>'}
function card(x){
 var m=S.my[x.id]||0,im=x.imgs||[],adm='';
 if(S.role!='Student'){
  if(x.s=='pending')adm='<button class="mb a" data-act="approved" data-id="'+x.id+'">Approve</button><button class="mb d" data-act="declined" data-id="'+x.id+'">Decline</button>';
  else if(x.s=='approved'&&!x.done)adm='<button class="mb s" data-act="solve" data-id="'+x.id+'">Mark solved</button>'}
 return '<article class="card '+x.k+'">'+
 '<div class="hd"><span class="av">↗</span><div><b>Anonymous Student</b><small>@'+esc(x.u)+' · '+(x.h?x.h+'h ago':'just now')+'</small></div><span class="cat">'+esc(x.c)+'</span></div>'+
 '<h3 class="serif">'+esc(x.t)+'</h3>'+(x.d?'<p>'+esc(x.d)+'</p>':'')+
 '<div class="tags"><span class="tg '+(x.k=='need'?'g':'r')+'">'+(x.k=='need'?'+ Add It':'Fix It')+'</span><span class="tg">📍 '+esc(x.l)+'</span></div>'+

 '<div class="acts"><div class="vt'+(m==1?' on':'')+'"><button class="ab up '+(m==1?'on':'')+'" data-v="'+x.id+'" data-d="1" aria-label="Upvote">'+ic(UP)+'</button><b>'+(x.v+m)+'</b></div>'+

function render(){
 var n=function(k){return D.filter(function(x){return x.k==k&&!x.done}).length};
 $('tabs').innerHTML=['broken','need'].map(function(k){return '<button data-t="'+k+'" class="'+(!S.arch&&S.tab==k?'on':'')+'">'+(k=='broken'?'🔧 Broken (Fix It)':'💡 Needs (Add It)')+' <span class="cnt">'+n(k)+'</span></button>'}).join('');
 $('ac').textContent=D.filter(function(x){return x.done}).length;
 var q=S.q.toLowerCase();
 var a=D.filter(function(x){
  if(S.arch?!x.done:(x.done||x.k!=S.tab))return false;
  if(S.sort=='photo'&&!(x.imgs&&x.imgs.length))return false;
  return !q||(x.t+x.l+x.d+x.c).toLowerCase().indexOf(q)>-1});
 a.sort(function(x,y){return S.sort=='new'?x.h-y.h:(y.v+(S.my[y.id]||0))-(x.v+(S.my[x.id]||0))});
 $('list').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Nothing here yet. Try another filter.</div>';
}
function prev(){$('prev').innerHTML=S.imgs.map(function(u,i){return '<div><img src="'+u+'" alt=""><button data-rm="'+i+'" aria-label="Remove">✕</button></div>'}).join('')}
document.addEventListener('click',function(e){
 var g=e.target.closest('.md img,.car img');if(g){$('lbi').src=g.src;$('lb').showModal();return}
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){S.tab=b.dataset.t;S.arch=false}
 else if(b.id=='arch')S.arch=!S.arch;
 else if(b.dataset.s){S.sort=b.dataset.s;[].forEach.call($('sort').children,function(c){c.classList.toggle('on',c==b)})}
 else if(b.dataset.v){var i=+b.dataset.v,d=+b.dataset.d;S.my[i]=S.my[i]==d?0:d}
 else if(b.dataset.act){D.forEach(function(x){if(x.id==b.dataset.id){if(b.dataset.act=='solve')x.done=1;else x.s=b.dataset.act}})}
 else if(b.dataset.share){try{navigator.clipboard.writeText(location.href)}catch(_){}var t=$('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1600);return}
 else if(b.parentNode.id=='role'){S.role=b.textContent;[].forEach.call($('role').children,function(c){c.classList.toggle('on',c==b)})}
 else if(b.dataset.nav){var sl=b.parentNode.querySelector('.sl');sl.scrollBy({left:sl.clientWidth*b.dataset.nav,behavior:'smooth'});return}
 else if(b.id=='post'){$('dlg').showModal();return}
 else if(b.id=='cx'){$('dlg').close();return}
 else if(b.dataset.rm){S.imgs.splice(+b.dataset.rm,1);prev();return}
 else if(b.id=='sv'){var t=$('nt').value.trim();if(t){D.push({id:Date.now(),k:$('nk').value,t:t,d:$('nd').value.trim(),l:$('nl').value||'Campus',c:'General',v:1,s:'pending',h:0,u:'anon_'+Math.random().toString(36).slice(2,6),cm:0,imgs:S.imgs.slice()});S.tab=$('nk').value;S.arch=false;S.sort='new';[].forEach.call($('sort').children,function(c){c.classList.toggle('on',c.dataset.s=='new')});$('nt').value=$('nd').value=$('nl').value='';S.imgs=[];prev()}$('dlg').close()}
 else if(b.id=='theme'){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';return}
 else return;
 render();
});
$('nf').addEventListener('change',function(e){
 [].slice.call(e.target.files).forEach(function(f){
  var r=new FileReader();
  r.onload=function(){if(S.imgs.length<4){S.imgs.push(r.result);prev()}};
  r.readAsDataURL(f)});
 e.target.value=''});
$('lb').addEventListener('click',function(){this.close()});
$('q').addEventListener('input',function(e){S.q=e.target.value;render()});
document.addEventListener('scroll',function(e){var sl=e.target;if(!sl.classList||!sl.classList.contains('sl'))return;var i=Math.round(sl.scrollLeft/sl.clientWidth),pa=sl.parentNode;pa.querySelector('.ctr').textContent=(i+1)+'/'+sl.children.length;[].forEach.call(pa.querySelectorAll('.dots i'),function(d,j){d.classList.toggle('on',j==i)})},true);
render();
</script>
